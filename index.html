<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas of Humans × AI</title>
<meta name="description" content="A map of studies on how AI affects people, with the direction of each effect.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Wide, two columns on large screens. Left: the network (sticky). Right: filters, stats and study cards.
   Areas own one colour each; effects own a separate set. Areas are the groups that emerge from the data.
   At this scale a dot in the overview stands for a bundle of studies with the same direction. */
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --ink:#15171c; --muted:#5f6674; --line:#e1e4ea; --soft:#f1f3f6;
  --d-enh:#2e9d5b; --d-mix:#e0aa1f; --d-dim:#d7453c; --d-trans:#3f6fe0; --d-none:#9aa0a8; --d-unk:#7d8490; --d-na:#c5cad2;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1014; --surface:#171a20; --ink:#eceef3; --muted:#9aa1ae; --line:#2a2e38; --soft:#212530;
  --d-enh:#4cc27d; --d-mix:#f0c04a; --d-dim:#f0675f; --d-trans:#6f93f5; --d-none:#6c727c; --d-unk:#9aa1ae; --d-na:#454b57;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1014; --surface:#171a20; --ink:#eceef3; --muted:#9aa1ae; --line:#2a2e38; --soft:#212530;
  --d-enh:#4cc27d; --d-mix:#f0c04a; --d-dim:#f0675f; --d-trans:#6f93f5; --d-none:#6c727c; --d-unk:#9aa1ae; --d-na:#454b57;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]:not([hidden=until-found i]){display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
button{font:inherit;color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:20px 24px 56px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 18px}
.mark{margin:0;font:800 40px/1 var(--display);letter-spacing:-.02em}
.mark small{display:block;margin-top:7px;font:500 13.5px/1.35 var(--body);letter-spacing:0;color:var(--muted)}
.hright{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.badge{font:500 10.5px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 10px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:500 12px var(--mono);color:var(--muted);cursor:pointer}
.layout{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:1020px){.layout{grid-template-columns:1fr}}
.gcol{position:sticky;top:14px;display:flex;flex-direction:column;gap:12px}
@media (max-width:1020px){.gcol{position:static}}
.icol{display:flex;flex-direction:column;gap:16px;min-width:0}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.fbtn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.fbtn:hover{border-color:var(--muted)}
.fbtn .n{font:500 11px/1 var(--mono);background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 7px}
.showing{font:400 12px/1.3 var(--mono);color:var(--muted);text-align:right}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:16px}
.fs{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.fs legend{padding:0;font:600 13px/1.3 var(--body);display:flex;justify-content:space-between;gap:8px;width:100%}
.fs legend output{font:500 12px var(--mono);color:var(--muted)}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.search{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit}
.chips-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:500;color:var(--muted);transition:background .12s,color .12s,border-color .12s}
.chip input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip input:focus-visible+span,:focus-visible{outline:2px solid var(--d-trans);outline-offset:2px}
.years{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.years label{display:flex;flex-direction:column;gap:2px;font:500 12px var(--mono);color:var(--muted)}
.years input{width:100%;accent-color:var(--ink);margin:6px 0 0}
details.grp{border-top:1px solid var(--line);padding-top:12px}
details.grp summary{cursor:pointer;font:600 13px/1.3 var(--body);display:flex;justify-content:space-between;list-style:none}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::after{content:"+";font:500 15px/1 var(--mono);color:var(--muted)}
details.grp[open] summary::after{content:"–"}
details.grp .chips-row{margin-top:10px}
.cnt{font:500 11.5px var(--mono);color:var(--muted);margin-left:auto;margin-right:12px}
.reset{align-self:flex-start;background:none;border:0;padding:0;font-weight:600;font-size:13px;color:var(--muted);text-decoration:underline;cursor:pointer}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font:500 12px/1.3 var(--mono);color:var(--muted)}
.crumbs button{background:none;border:0;padding:4px 2px;cursor:pointer;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.crumbs button:hover{color:var(--ink)}
.crumbs .here{color:var(--ink);padding:4px 2px}
.crumbs .sep{opacity:.5}
h2.title{margin:0;font:700 30px/1.1 var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h2.title i{width:14px;height:14px;border-radius:50%;flex:none;background:var(--c,var(--ink))}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.stats{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.total{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.total .big{font:700 46px/1 var(--display);font-variant-numeric:tabular-nums}
.total .of{font:400 12px var(--mono);color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:600 24px/1 var(--mono);font-variant-numeric:tabular-nums}
.stat span{display:flex;align-items:center;gap:5px;font-size:11.5px;line-height:1.2;color:var(--muted)}
.stat i,.gh i,.dlg i{width:9px;height:9px;border-radius:50%;flex:none}
i.unk{background:none!important;border:1.6px solid var(--d-unk)}
.stackbar{display:flex;height:11px;border-radius:6px;overflow:hidden;background:var(--soft);gap:2px}
.stackbar i{display:block;min-width:0}
.stackbar i.unk{background:repeating-linear-gradient(135deg,var(--d-unk) 0 2px,transparent 2px 5px)!important;border:0;opacity:.7}
.hist{display:flex;flex-direction:column;gap:4px}
.hist .bars{display:flex;align-items:flex-end;gap:2px;height:46px}
.hist .bars i{flex:1;background:var(--hc,var(--ink));opacity:.85;border-radius:2px 2px 0 0;min-height:2px}
.hist .bars i.z{opacity:.25}
.hist .ax{display:flex;justify-content:space-between;font:400 10.5px var(--mono);color:var(--muted)}
.note{margin:0;font-size:12.5px;color:var(--muted)}
.note button{background:none;border:0;padding:0;font-weight:600;color:var(--ink);text-decoration:underline;cursor:pointer;font-size:12.5px}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gtop .seg button{padding:6px 12px;font-size:13px}
.graph{position:relative;width:100%;aspect-ratio:1/1}
.graph canvas{width:100%;height:100%;display:block;touch-action:pan-y}
.rot{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:500 11px/1 var(--mono);color:var(--muted);cursor:pointer}
.gcap{margin:-2px 0 0;font-size:12.5px;color:var(--muted);text-align:center}
.dlg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12.5px;color:var(--muted)}
.dlg span{display:inline-flex;align-items:center;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.lg{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.lg i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.lg b{font:500 12px var(--mono);color:var(--muted)}
.lg:hover{border-color:var(--muted)}
.lg.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lg.on b{color:var(--bg);opacity:.8}
.lg.zero{border-style:dashed;color:var(--muted)}
.lg.zero i{background:none;border:1.5px dashed var(--c)}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:300px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none}
.tip b{display:block;margin-bottom:2px;font-size:13px}
.gh{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font:600 14px/1.2 var(--body)}
.gh span{font:500 12px var(--mono);color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;scroll-margin-top:16px}
.card.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--fc)}100%{box-shadow:0 0 0 3px transparent}}
.card h3{margin:0;font:600 15px/1.35 var(--body);overflow-wrap:anywhere}
.card h3 a{color:inherit}
.fi{margin:0;font-size:13.5px;color:var(--ink)}
.meta{font:400 11.5px/1.45 var(--mono);color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;color:var(--muted);background:var(--soft);border-radius:6px;padding:3px 7px}
.tag.chk{color:var(--ink);background:none;border:1px dashed var(--muted)}
.ai{font:500 10.5px var(--mono);color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 6px;align-self:flex-start}
.more{align-self:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--ink)}
.empty button{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.foot{font:400 11.5px/1.5 var(--mono);color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:reduce){.card.flash{animation:none}.chip span{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="mark">AHA<small>Atlas of Humans × AI</small></h1>
    <div class="hright">
      <div class="seg" role="group" aria-label="How the studies are grouped">
        <button id="v2b" aria-pressed="true" title="Groups that emerge from what each study says about people">Human focus</button>
        <button id="v1b" aria-pressed="false" title="Groups that emerge from topic and technology">Topic &amp; technology</button>
      </div>
      <button class="tbtn" id="theme" aria-label="Switch colour theme">Auto</button>
      <span class="badge" id="badge"></span>
    </div>
  </header>
  <div class="layout">
    <div class="gcol">
      <div class="gtop">
        <div class="seg" role="group" aria-label="Colour the dots by"><button id="cArea" aria-pressed="true">Colour: area</button><button id="cDir" aria-pressed="false">Colour: effect</button></div>
        <button class="rot" id="rot" aria-pressed="true">Pause</button>
      </div>
      <div class="graph" id="graph"><canvas id="cv" role="img" aria-label="Network of studies grouped by area. Use the buttons below to open an area."></canvas></div>
      <p class="gcap" id="gcap"></p>
      <div class="dlg" id="dlg" hidden></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="icol">
      <div class="bar-row">
        <button class="fbtn" id="fbtn" aria-expanded="false" aria-controls="filters">Filters <span class="n" id="fcount" hidden>0</span></button>
        <div class="showing" id="showing"></div>
      </div>
      <section class="panel" id="filters" hidden></section>
      <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
      <div id="head"></div>
      <div id="stats"></div>
      <div id="cards"></div>
    </div>
  </div>
  <p class="foot" id="foot"></p>
</div>
<div class="tip" id="tip"></div>
<script src="atlas_data.js"></script>
<script>
(function(){
const A=window.ATLAS,DC=A.dicts;
/* ---------- constants ---------- */
const DIRS_ALL=[{id:'enh',label:'Enhances',sub:'positive'},{id:'mix',label:'Mixed',sub:'mixed / neutral'},{id:'dim',label:'Diminishes',sub:'negative'},
  {id:'trans',label:'Transforms',sub:'transformative'},{id:'none',label:'No effect',sub:'no effect'},{id:'unk',label:'Not stated',sub:'the available text does not say'},{id:'na',label:'No effect studied',sub:'not a study of what AI does to people'}];
let DIRS=DIRS_ALL.slice(0,6);
const INVL={effect_on_people:'Effect of AI on people',people_use_ai:'How people use AI',ai_for_people:'AI built for people',ai_only:'AI systems themselves',other:'Other'};
const DES={rct:'Randomised trial',exp:'Experiment',long:'Longitudinal',cross:'Survey / cross-sectional',qual:'Qualitative',review:'Review / meta-analysis',theory:'Theory / commentary',technical:'Technical / system',unk:'Design unclear'};
const SEPARATE=['review','theory','technical'];
const AIN={llm:'Language models',gen:'Generative',rec:'Recommenders',dec:'Decision aids',comp:'Chatbots / companions',tutor:'Tutoring',auto:'Automation',robot:'Robots',other:'Other AI',none:'No AI'};
const ST={peer:'Peer-reviewed',preprint:'Preprint',grey:'Grey literature'};
const CONF=[['high','High (70+)',s=>s.cf>=70],['med','Medium (50–69)',s=>s.cf>=50&&s.cf<70],['low','Low (under 50)',s=>s.cf<50]];
const PAGE=30;
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let REST=null,RESTLOADING=null;

/* ---------- data ---------- */
const ALL=A.studies.map(a=>({num:a[0],id:'AHA-'+String(a[0]).padStart(5,'0'),t:a[1],y:a[2],d:a[3],v:DC.venue[a[4]],a:a[5],dir:DC.dir[a[6]],de:DC.design[a[7]],ai:DC.ai[a[8]],cf:a[9],
  hf:a[10],fi:a[11],lang:DC.lang[a[12]],st:DC.status[a[13]],pop:DC.pop[a[14]],set:DC.set[a[15]],al:a[16],c2:a[17],s2:a[18],a2:a[19],c1:a[20],s1:a[21],flag:a[22],inv:'effect_on_people',
  q:(a[1]+' '+a[10]+' '+a[11]).toLowerCase()}));
const YS=ALL.map(s=>s.y).filter(y=>y>=1900&&y<=2100),Y0=Math.min(...YS),Y1=Math.max(...YS);

/* ---------- state ---------- */
let VIEW='v2',CAPS=[],STUDIES=[],BYCAP={},BYSUB={};
const S={cap:null,sub:null,colour:'area',page:{},q:''};
const F={},OPTS={};
function buildOpts(P){
  const cnt=f=>{const c={};P.forEach(s=>{const v=f(s);c[v]=(c[v]||0)+1});return c};
  const d=cnt(s=>s.de),a=cnt(s=>s.ai),t=cnt(s=>s.st),l=cnt(s=>s.lang==='en'?'en':'other');
  const iv=cnt(s=>s.inv);
  OPTS.inv=Object.keys(INVL).filter(k=>iv[k]).map(k=>[k,INVL[k],iv[k]]);
  OPTS.dir=DIRS.map(x=>[x.id,x.label,P.filter(s=>s.dir===x.id).length]).filter(o=>o[2]);
  OPTS.design=Object.keys(DES).filter(k=>d[k]).map(k=>[k,DES[k],d[k]]);
  OPTS.ai=Object.keys(AIN).filter(k=>a[k]).map(k=>[k,AIN[k],a[k]]);
  OPTS.status=Object.keys(ST).filter(k=>t[k]).map(k=>[k,ST[k],t[k]]);
  OPTS.lang=[['en','English',l.en||0],['other','Non-English',l.other||0]].filter(o=>o[2]);
  OPTS.conf=CONF.map(c=>[c[0],c[1],P.filter(c[2]).length]);
}
const GROUPS=[['inv','Topic of the work'],['dir','Direction of effect'],['design','Study type'],['conf','Coding confidence'],['ai','AI type'],['status','Publication status'],['lang','Language']];
function resetF(){Object.keys(OPTS).forEach(k=>{F[k]=new Set(OPTS[k].map(o=>o[0]))});SEPARATE.forEach(v=>F.design.delete(v));F.from=Y0;F.to=Y1;S.q='';const q=$('#q');if(q)q.value=''}
function defOf(k){return OPTS[k].map(o=>o[0]).filter(v=>!(k==='design'&&SEPARATE.includes(v)))}
function isDef(k){const d=defOf(k);return F[k].size===d.length&&d.every(v=>F[k].has(v))}
function activeCount(){let n=0;Object.keys(OPTS).forEach(k=>{if(!isDef(k))n++});if(F.from!==Y0||F.to!==Y1)n++;if(S.q)n++;return n}
const confOf=s=>s.cf>=70?'high':s.cf>=50?'med':'low';
function passes(s,ignore){
  if(s.y&&(s.y<F.from||s.y>F.to))return false;
  if(!F.inv.has(s.inv)||!F.dir.has(s.dir)||!F.ai.has(s.ai)||!F.status.has(s.st)||!F.lang.has(s.lang==='en'?'en':'other')||!F.conf.has(confOf(s)))return false;
  if(ignore!=='design'&&s.inv==='effect_on_people'&&!F.design.has(s.de))return false;
  if(S.q&&s.q.indexOf(S.q)<0)return false;
  return true;
}
function ensureRest(){
  if(REST)return Promise.resolve();
  if(RESTLOADING)return RESTLOADING;
  RESTLOADING=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='atlas_v1_rest.js';
    sc.onload=()=>{const R=window.ATLAS_REST;REST=R.studies.map(a=>({num:a[0],id:'AHA-'+String(a[0]).padStart(5,'0'),t:a[1],y:a[2],d:a[3],v:'',a:'',inv:A.inv[a[4]],dir:DC.dir[a[5]],de:DC.design[a[6]],ai:DC.ai[a[7]],cf:a[8],
      hf:'',fi:'',lang:DC.lang[a[11]],st:DC.status[a[12]],pop:'',set:'',al:'',c2:-1,s2:-1,a2:-1,c1:a[9],s1:a[10],flag:0,q:a[1].toLowerCase()}));res()};
    sc.onerror=()=>{RESTLOADING=null;rej(new Error('load failed'))};document.head.appendChild(sc)});
  return RESTLOADING;
}
function switchView(v){
  if(v==='v1'&&!REST){const b=$('#v1b');b.textContent='Loading all works…';b.disabled=true;
    ensureRest().then(()=>{b.textContent='Topic & technology';b.disabled=false;setView('v1')}).catch(()=>{b.textContent='Topic & technology';b.disabled=false;alert('Could not load the full set of works. Check your connection and try again.')});return}
  setView(v);
}
function setView(v){
  VIEW=v;DIRS=v==='v1'?DIRS_ALL:DIRS_ALL.slice(0,6);
  const POOL=v==='v1'?ALL.concat(REST):ALL;
  buildOpts(POOL);buildFilters();resetF();
  CAPS=A.views[v].map((c,i)=>({id:'c'+i,i,name:c.name,desc:c.desc||'',ne:!!c.ne,subs:c.subs.map((s,j)=>({id:'s'+j,j,name:s.name}))}));
  STUDIES=POOL.map(x=>{x.cap='c'+(v==='v2'?x.c2:x.c1);x.sub='s'+(v==='v2'?x.s2:x.s1);x.also=v==='v2'&&x.a2>=0?'c'+x.a2:null;return x});
  BYCAP={};BYSUB={};
  STUDIES.forEach(s=>{(BYCAP[s.cap]=BYCAP[s.cap]||[]).push(s);const k=s.cap+'/'+s.sub;(BYSUB[k]=BYSUB[k]||[]).push(s)});
  S.cap=null;S.sub=null;S.page={};viewKey='';
  $('#v2b').setAttribute('aria-pressed',v==='v2');$('#v1b').setAttribute('aria-pressed',v==='v1');

    <div class="stackbar" role="img" aria-label="${DIRS.map(d=>d.label+' '+c[d.id]).join(', ')}">${bar}</div>
    <div class="hist" aria-label="Studies per year"><div class="bars">${bars}</div><div class="ax"><span>${lo<1990?lo+'s':lo}</span><span>studies per year</span><span>${Y1}</span></div></div>
    ${note}</section>`;
}
function card(s){
  const tags=[ST[s.st]||s.st,AIN[s.ai]||s.ai];
  if(s.inv!=='effect_on_people')tags.unshift(INVL[s.inv]||s.inv);
  if(s.hf&&s.hf!=='none')tags.push(s.hf);
  if(s.pop&&s.pop!=='none')tags.push(s.pop);
  if(s.set&&s.set!=='none')tags.push(s.set);
  if(s.lang!=='en')tags.push('Language: '+s.lang);
  const link=s.d?`https://doi.org/${s.d}`:null;
  return `<li class="card" id="card-${s.id}">
    <h3>${link?`<a href="${esc(link)}" target="_blank" rel="noopener">${esc(s.t)}</a>`:esc(s.t)}</h3>
    ${s.fi&&s.fi!=='No finding stated.'?`<p class="fi">${esc(s.fi)}</p>`:''}
    <div class="meta">${s.y||'Year unknown'} · ${DES[s.de]||s.de}${s.a?` · ${esc(s.a)}`:''}${s.v?`<br>${esc(s.v)}`:''}</div>
    <div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${s.flag?'<span class="tag chk">needs checking</span>':''}</div>
    ${s.al?`<div class="meta">Also touches ${esc(s.al)}</div>`:''}
    <span class="ai">AI-coded · not yet verified · confidence ${s.cf}%</span>
    <div class="meta">${s.id}</div></li>`;
}
function renderCards(){
  const cap=byCapId(S.cap),sub=cap&&cap.subs.find(s=>s.id===S.sub);let cards='';
  if(sub){
    const arr=visible(BYSUB[cap.id+'/'+sub.id]||[]);
    if(!arr.length)cards=`<div class="empty"><b>No studies match these filters</b><span>Widen the years or turn a filter back on.</span><button data-act="reset">Reset filters</button></div>`;
    else DIRS.forEach(d=>{
      const items=arr.filter(s=>s.dir===d.id).sort((a,b)=>b.y-a.y||a.id.localeCompare(b.id));
      if(!items.length)return;const shown=S.page[d.id]||PAGE;
      cards+=`<h3 class="gh"><i class="${d.id==='unk'?'unk':''}" style="background:var(--d-${d.id})"></i>${d.id==='unk'?'Not stated in the text':d.id==='na'?'No effect on people studied':d.label}<span>${items.length.toLocaleString('en-GB')}</span></h3><ul class="list">${items.slice(0,shown).map(card).join('')}</ul>`+
        (items.length>shown?`<button class="more" data-more="${d.id}">Show ${Math.min(PAGE,items.length-shown)} more of ${(items.length-shown).toLocaleString('en-GB')}</button>`:'');
    });
  }
  $('#cards').innerHTML=cards;
}

/* ---------- render ---------- */
function render(){
  const cap=byCapId(S.cap),sub=cap&&cap.subs.find(s=>s.id===S.sub);
  const scope=sub?(BYSUB[cap.id+'/'+sub.id]||[]):cap?(BYCAP[cap.id]||[]):STUDIES;
  const arr=visible(scope);
  const color=cap?`var(--c-${cap.id})`:'var(--ink)';
  const rootName=VIEW==='v2'?'All areas':'All topics';
  let crumbs;
  if(!cap)crumbs=`<span class="here">${rootName}</span>`;
  else if(!sub)crumbs=`<button data-go="root">${rootName}</button><span class="sep">›</span><span class="here">${esc(cap.name)}</span>`;
  else crumbs=`<button data-go="root">${rootName}</button><span class="sep">›</span><button data-go="cap:${cap.id}">${esc(cap.name)}</button><span class="sep">›</span><span class="here">${esc(sub.name)}</span>`;
  $('#crumbs').innerHTML=crumbs;
  const title=sub?sub.name:cap?cap.name:(VIEW==='v2'?`${CAPS.length} areas that emerged`:`${CAPS.length} topic groups`);
  let line;
  if(!cap)line=VIEW==='v2'?'Groups of studies by what they say about people. Tap one to open it.':'Groups of studies by topic and technology. Tap one to open it.';
  else if(!sub)line=(cap.desc?cap.desc+' ':'')+`${cap.subs.length} sub-area${cap.subs.length===1?'':'s'}. Tap one to read the studies.`;
  else line='Grouped by effect, newest first.';
  $('#head').innerHTML=`<h2 class="title" style="--c:${color}">${cap?'<i></i>':''}${esc(title)}</h2><p class="sub">${esc(line)}</p>`;
  $('#stats').innerHTML=statsBlock(arr,scope.length,color,scope);
  const key=VIEW+'|'+S.cap+'/'+S.sub;
  G=buildGraph(cap,sub);G.t0=(key===viewKey&&window.__t0)?window.__t0:performance.now();
  if(key!==viewKey){window.__t0=G.t0;viewKey=key}
  const kt=G.k>1?` Each dot is a bundle of up to ${G.k} studies with the same effect.`:' Each dot is one study.';
  $('#gcap').textContent=(!cap?(VIEW==='v2'?'Lines join areas whose studies also bear on each other; thicker means more studies. Non-English studies sit apart.':'Areas are automatic topic and technology groups. Non-English studies sit apart.')
    :!sub?(VIEW==='v2'?'Outer dots are the other areas. Lines show studies that also bear on them.':'Outer dots are the other groups.')
    :'Dots are grouped by effect. Tap a dot to jump to its card.')+kt;
  const dl=$('#dlg');dl.hidden=!(S.colour==='dir'||sub);
  dl.innerHTML=DIRS.map(d=>`<span><i class="${d.id==='unk'?'unk':''}" style="background:var(--d-${d.id})"></i>${d.label}</span>`).join('');
  let lg;
  if(!cap)lg=CAPS.map(c=>({go:'cap:'+c.id,col:c.id,name:c.name,n:visible(BYCAP[c.id]||[]).length,base:(BYCAP[c.id]||[]).length,on:false}));
  else lg=cap.subs.map(s=>({go:`sub:${cap.id}:${s.id}`,col:cap.id,name:s.name,n:visible(BYSUB[cap.id+'/'+s.id]||[]).length,base:(BYSUB[cap.id+'/'+s.id]||[]).length,on:!!sub&&sub.id===s.id}));
  $('#legend').innerHTML=lg.map(i=>`<button class="lg${i.on?' on':''}${i.base===0?' zero':''}" style="--c:var(--c-${i.col})" data-go="${i.go}"><i></i>${esc(i.name)} <b>${i.n.toLocaleString('en-GB')}</b></button>`).join('');
  renderCards();syncFilterUI();dirty=true;
}

/* ---------- filters ---------- */
function buildFilters(){
  let h=`<fieldset class="fs"><legend>Search titles, topics and findings</legend><input class="search" type="search" id="q" placeholder="e.g. loneliness, critical thinking, ChatGPT"></fieldset>
    <fieldset class="fs"><legend>Year published <output id="yr"></output></legend>
    <div class="years"><label>From<input type="range" id="yfrom" min="${Y0}" max="${Y1}" step="1"></label>
    <label>To<input type="range" id="yto" min="${Y0}" max="${Y1}" step="1"></label></div></fieldset>`;
  GROUPS.forEach((g,i)=>{
    if(g[0]==='inv'&&OPTS.inv.length<2)return;
    h+=`<details class="grp"${i<3?' open':''}><summary>${g[1]}<span class="cnt" id="cnt-${g[0]}"></span></summary>
      <div class="chips-row">${OPTS[g[0]].map(o=>`<label class="chip"><input type="checkbox" data-g="${g[0]}" value="${o[0]}"><span>${o[1]} · ${o[2].toLocaleString('en-GB')}</span></label>`).join('')}</div></details>`;
  });
  h+=`<p class="hint">Age group, region, funding and sample size are not coded yet, so they are not offered as filters.</p><button class="reset" data-act="reset">Reset all filters</button>`;
  $('#filters').innerHTML=h;
}
function syncFilterUI(){
  document.querySelectorAll('#filters input[data-g]').forEach(i=>{i.checked=F[i.dataset.g].has(i.value)});
  GROUPS.forEach(g=>{const e=$('#cnt-'+g[0]);if(e&&F[g[0]])e.textContent=F[g[0]].size+'/'+OPTS[g[0]].length});
  const yf=$('#yfrom'),yt=$('#yto');
  if(yf){yf.value=F.from;yt.value=F.to;$('#yr').textContent=F.from===F.to?F.from:F.from+'–'+F.to}
  const n=activeCount(),fc=$('#fcount');fc.textContent=n;fc.hidden=n===0;
  $('#showing').textContent=STUDIES.filter(s=>passes(s)).length.toLocaleString('en-GB')+' of '+STUDIES.length.toLocaleString('en-GB')+(VIEW==='v1'?' works':' studies');
}
function navigate(go){
  const p=go.split(':');
  if(p[0]==='root'){S.cap=null;S.sub=null}else if(p[0]==='cap'){S.cap=p[1];S.sub=null}else{S.cap=p[1];S.sub=p[2]}
  S.page={};render();
  $('#crumbs').scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){navigate(g.dataset.go);return}
  const m=e.target.closest('[data-more]');if(m){S.page[m.dataset.more]=(S.page[m.dataset.more]||PAGE)+PAGE;renderCards();return}
  const a=e.target.closest('[data-act]');
  if(a){if(a.dataset.act==='reset')resetF();if(a.dataset.act==='reviews')SEPARATE.forEach(v=>F.design.add(v));S.page={};render()}
});
$('#fbtn').addEventListener('click',()=>{const p=$('#filters'),open=p.hidden;p.hidden=!open;$('#fbtn').setAttribute('aria-expanded',String(open))});
$('#filters').addEventListener('change',e=>{const t=e.target;if(t.dataset.g){t.checked?F[t.dataset.g].add(t.value):F[t.dataset.g].delete(t.value)}S.page={};render()});
let qt;$('#filters').addEventListener('input',e=>{const t=e.target;
  if(t.id==='yfrom'){F.from=Math.min(+t.value,F.to);S.page={};render()}
  if(t.id==='yto'){F.to=Math.max(+t.value,F.from);S.page={};render()}
  if(t.id==='q'){clearTimeout(qt);qt=setTimeout(()=>{S.q=t.value.trim().toLowerCase();S.page={};render()},220)}});
$('#v2b').onclick=()=>switchView('v2');$('#v1b').onclick=()=>switchView('v1');
$('#cArea').onclick=()=>{S.colour='area';$('#cArea').setAttribute('aria-pressed',true);$('#cDir').setAttribute('aria-pressed',false);render()};
$('#cDir').onclick=()=>{S.colour='dir';$('#cDir').setAttribute('aria-pressed',true);$('#cArea').setAttribute('aria-pressed',false);render()};
(function(){const b=$('#theme'),modes=['auto','light','dark'];let cur='auto';try{cur=localStorage.getItem('aha-theme')||'auto'}catch(e){}
  function ap(){if(cur==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',cur);b.textContent=cur[0].toUpperCase()+cur.slice(1)}
  ap();b.onclick=()=>{cur=modes[(modes.indexOf(cur)+1)%3];try{localStorage.setItem('aha-theme',cur)}catch(e){}ap()}})();
if(!rotating){$('#rot').textContent='Rotate';$('#rot').setAttribute('aria-pressed','false')}
setView('v2');sizeCanvas();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
