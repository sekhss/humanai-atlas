<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas of Humans × AI</title>
<meta name="description" content="A map of research studies on how AI affects people, with the direction of each effect.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: wide, two columns on large screens. Left: the network (sticky). Right: filters, stats and the study cards.
   Areas own one colour each; effects own a separate set. Areas are the groups that emerge from the data. */
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --ink:#15171c; --muted:#5f6674; --line:#e1e4ea; --soft:#f1f3f6;
  --d-enh:#2e9d5b; --d-mix:#e0aa1f; --d-dim:#d7453c; --d-trans:#3f6fe0; --d-none:#9aa0a8; --d-unk:#7d8490;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1014; --surface:#171a20; --ink:#eceef3; --muted:#9aa1ae; --line:#2a2e38; --soft:#212530;
  --d-enh:#4cc27d; --d-mix:#f0c04a; --d-dim:#f0675f; --d-trans:#6f93f5; --d-none:#6c727c; --d-unk:#9aa1ae;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1014; --surface:#171a20; --ink:#eceef3; --muted:#9aa1ae; --line:#2a2e38; --soft:#212530;
  --d-enh:#4cc27d; --d-mix:#f0c04a; --d-dim:#f0675f; --d-trans:#6f93f5; --d-none:#6c727c; --d-unk:#9aa1ae;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]:not([hidden=until-found i]){display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
button{font:inherit;color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:20px 24px 56px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 18px}
.mark{margin:0;font:800 40px/1 var(--display);letter-spacing:-.02em}
.mark small{display:block;margin-top:7px;font:500 13.5px/1.35 var(--body);letter-spacing:0;color:var(--muted)}
.hright{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.badge{font:500 10.5px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 10px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lnk{font-size:13px;color:var(--muted)}
.tbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:500 12px var(--mono);color:var(--muted);cursor:pointer}
.layout{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:1020px){.layout{grid-template-columns:1fr}}
.gcol{position:sticky;top:14px;display:flex;flex-direction:column;gap:12px}
@media (max-width:1020px){.gcol{position:static}}
.icol{display:flex;flex-direction:column;gap:16px;min-width:0}

.bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.fbtn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.fbtn:hover{border-color:var(--muted)}
.fbtn .n{font:500 11px/1 var(--mono);background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 7px}
.fbtn .n[hidden]{display:none}
.showing{font:400 12px/1.3 var(--mono);color:var(--muted);text-align:right}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:16px}
.fs{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.fs legend{padding:0;font:600 13px/1.3 var(--body);display:flex;justify-content:space-between;gap:8px;width:100%}
.fs legend output{font:500 12px var(--mono);color:var(--muted)}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.chips-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:500;color:var(--muted);transition:background .12s,color .12s,border-color .12s}
.chip input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip input:focus-visible+span{outline:2px solid var(--d-trans);outline-offset:2px}
.years{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.years label{display:flex;flex-direction:column;gap:2px;font:500 12px var(--mono);color:var(--muted)}
.years input{width:100%;accent-color:var(--ink);margin:6px 0 0}
details.grp{border-top:1px solid var(--line);padding-top:12px}
details.grp summary{cursor:pointer;font:600 13px/1.3 var(--body);display:flex;justify-content:space-between;list-style:none}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::after{content:"+";font:500 15px/1 var(--mono);color:var(--muted)}
details.grp[open] summary::after{content:"–"}
details.grp .chips-row{margin-top:10px}
.cnt{font:500 11.5px var(--mono);color:var(--muted);margin-left:auto;margin-right:12px}
.reset{align-self:flex-start;background:none;border:0;padding:0;font-weight:600;font-size:13px;color:var(--muted);text-decoration:underline;cursor:pointer}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font:500 12px/1.3 var(--mono);color:var(--muted)}
.crumbs button{background:none;border:0;padding:4px 2px;cursor:pointer;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.crumbs button:hover{color:var(--ink)}
.crumbs .here{color:var(--ink);padding:4px 2px}
.crumbs .sep{opacity:.5}
h2.title{margin:0;font:700 30px/1.1 var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h2.title i{width:14px;height:14px;border-radius:50%;flex:none;background:var(--c,var(--ink))}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.stats{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.total{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.total .big{font:700 46px/1 var(--display);font-variant-numeric:tabular-nums}
.total .of{font:400 12px var(--mono);color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:600 26px/1 var(--mono);font-variant-numeric:tabular-nums}
.stat span{display:flex;align-items:center;gap:5px;font-size:11.5px;line-height:1.2;color:var(--muted)}
.stat i,.gh i{width:9px;height:9px;border-radius:50%;flex:none}
.stat i.unk,.gh i.unk,.dlg i.unk{background:none!important;border:1.6px solid var(--d-unk)}
.stackbar{display:flex;height:11px;border-radius:6px;overflow:hidden;background:var(--soft);gap:2px}
.stackbar i{display:block;min-width:0}
.stackbar i.unk{background:repeating-linear-gradient(135deg,var(--d-unk) 0 2px,transparent 2px 5px)!important;opacity:.7}
.hist{display:flex;flex-direction:column;gap:4px}
.hist .bars{display:flex;align-items:flex-end;gap:2px;height:46px}
.hist .bars i{flex:1;background:var(--hc,var(--ink));opacity:.85;border-radius:2px 2px 0 0;min-height:2px}
.hist .bars i.z{opacity:.25}
.hist .ax{display:flex;justify-content:space-between;font:400 10.5px var(--mono);color:var(--muted)}
.note{margin:0;font-size:12.5px;color:var(--muted)}
.note button{background:none;border:0;padding:0;font-weight:600;color:var(--ink);text-decoration:underline;cursor:pointer;font-size:12.5px}

.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gtop .seg button{padding:6px 12px;font-size:13px}
.graph{position:relative;width:100%;aspect-ratio:1/1}
.graph canvas{width:100%;height:100%;display:block;touch-action:pan-y}
.rot{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:500 11px/1 var(--mono);color:var(--muted);cursor:pointer}
.rot:hover{color:var(--ink);border-color:var(--muted)}
.gcap{margin:-2px 0 0;font-size:12.5px;color:var(--muted);text-align:center}
.dlg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12.5px;color:var(--muted)}
.dlg span{display:inline-flex;align-items:center;gap:6px}
.dlg i{width:9px;height:9px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.lg{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.lg i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.lg b{font:500 12px var(--mono);color:var(--muted)}
.lg:hover{border-color:var(--muted)}
.lg.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lg.on b{color:var(--bg);opacity:.8}
.lg.zero{border-style:dashed;color:var(--muted)}
.lg.zero i{background:none;border:1.5px dashed var(--c)}
.lg:focus-visible,.rot:focus-visible,.tbtn:focus-visible,.seg button:focus-visible{outline:2px solid var(--d-trans);outline-offset:2px}
.gh{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font:600 14px/1.2 var(--body)}
.gh span{font:500 12px var(--mono);color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;scroll-margin-top:16px}
.card.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--fc)}100%{box-shadow:0 0 0 3px transparent}}
.card h3{margin:0;font:600 15px/1.35 var(--body);overflow-wrap:anywhere}
.card h3 a{color:inherit}
.meta{font:400 11.5px/1.45 var(--mono);color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;color:var(--muted);background:var(--soft);border-radius:6px;padding:3px 7px}
.ai{font:500 10.5px var(--mono);color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 6px;align-self:flex-start}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--ink)}
.empty button{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.foot{font:400 11.5px/1.5 var(--mono);color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:reduce){.card.flash{animation:none}.chip span{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="mark">AHA<small>Atlas of Humans × AI</small></h1>
    <div class="hright">
      <div class="seg" role="group" aria-label="How the studies are grouped">
        <button id="v2b" aria-pressed="true" title="Groups that emerge from what each study says about people">Human focus</button>
        <button id="v1b" aria-pressed="false" title="Groups that emerge from topic and technology">Topic &amp; technology</button>
      </div>
      <a class="lnk" href="explorer.html">Group explorer</a>
      <button class="tbtn" id="theme" aria-label="Switch colour theme">Auto</button>
      <span class="badge" id="badge">Prototype · 1,000-work sample</span>
    </div>
  </header>

  <div class="layout">
    <div class="gcol">
      <div class="gtop">
        <div class="seg" role="group" aria-label="Colour the dots by"><button id="cArea" aria-pressed="true">Colour: area</button><button id="cDir" aria-pressed="false">Colour: effect</button></div>
        <button class="rot" id="rot" aria-pressed="true">Pause</button>
      </div>
      <div class="graph" id="graph"><canvas id="cv" role="img" aria-label="Network of studies grouped by area. Use the buttons below to open an area."></canvas></div>
      <p class="gcap" id="gcap"></p>
      <div class="dlg" id="dlg" hidden></div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="icol">
      <div class="bar-row">
        <button class="fbtn" id="fbtn" aria-expanded="false" aria-controls="filters">Filters <span class="n" id="fcount" hidden>0</span></button>
        <div class="showing" id="showing"></div>
      </div>
      <section class="panel" id="filters" hidden></section>
      <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
      <div id="head"></div>
      <div id="stats"></div>
      <div id="cards"></div>
    </div>
  </div>
  <p class="foot" id="foot"></p>
</div>
<script src="atlas_data.js"></script>
<script>
(function(){
const A=window.ATLAS;
/* ---------- constants ---------- */
const DIRS=[{id:'enh',label:'Enhances',sub:'positive'},{id:'mix',label:'Mixed',sub:'mixed / neutral'},{id:'dim',label:'Diminishes',sub:'negative'},
  {id:'trans',label:'Transforms',sub:'transformative'},{id:'none',label:'No effect',sub:'no effect'},{id:'unk',label:'Not stated',sub:'the available text does not say'}];
const DES={rct:'Randomised trial',exp:'Experiment',long:'Longitudinal',cross:'Survey / cross-sectional',qual:'Qualitative',review:'Review / meta-analysis',theory:'Theory / commentary',technical:'Technical / system',unk:'Design unclear'};
const SEPARATE=['review','theory','technical'];
const AIN={llm:'Language models',gen:'Generative',rec:'Recommenders',dec:'Decision aids',comp:'Chatbots / companions',tutor:'Tutoring',auto:'Automation',robot:'Robots',other:'Other AI',none:'No AI'};
const ST={peer:'Peer-reviewed',preprint:'Preprint',grey:'Grey literature'};
const MODE='';
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safe=s=>String(s).replace(/[^A-Za-z0-9]/g,'_');
const L=A.studies.map(x=>x.y);const Y0=Math.min(...L),Y1=Math.max(...L);

/* ---------- state ---------- */
let VIEW='v2',CAPS=[],STUDIES=[],BYSUB={},byCap={};
const S={cap:null,sub:null,colour:'area'};
const F={};
const OPTS={};
function buildOpts(){
  const cnt=(k,f)=>{const c={};A.studies.forEach(s=>{const v=f?f(s):s[k];c[v]=(c[v]||0)+1});return c};
  const d=cnt('de'),a=cnt('ai'),t=cnt('st'),l=cnt('lang',s=>s.lang==='en'?'en':'other');
  OPTS.design=Object.keys(DES).filter(k=>d[k]).map(k=>[k,DES[k],d[k]]);
  OPTS.ai=Object.keys(AIN).filter(k=>a[k]).map(k=>[k,AIN[k],a[k]]);
  OPTS.status=Object.keys(ST).filter(k=>t[k]).map(k=>[k,ST[k],t[k]]);
  OPTS.lang=[['en','English',l.en||0],['other','Non-English',l.other||0]].filter(o=>o[2]);
  OPTS.dir=DIRS.map(x=>[x.id,x.label,A.studies.filter(s=>s.dir===x.id).length]);
}
const GROUPS=[['dir','Direction of effect'],['design','Study type'],['ai','AI type'],['status','Publication status'],['lang','Language']];
function resetF(){
  Object.keys(OPTS).forEach(k=>{F[k]=new Set(OPTS[k].map(o=>o[0]))});
  SEPARATE.forEach(v=>F.design.delete(v));F.from=Y0;F.to=Y1;
}
function defOf(k){return OPTS[k].map(o=>o[0]).filter(v=>!(k==='design'&&SEPARATE.includes(v)))}
function isDef(k){const d=defOf(k);return F[k].size===d.length&&d.every(v=>F[k].has(v))}
function activeCount(){let n=0;Object.keys(OPTS).forEach(k=>{if(!isDef(k))n++});if(F.from!==Y0||F.to!==Y1)n++;return n}
function passes(s,ignore){
  if(s.y<F.from||s.y>F.to)return false;
  if(!F.dir.has(s.dir)||!F.ai.has(s.ai)||!F.status.has(s.st)||!F.lang.has(s.lang==='en'?'en':'other'))return false;
  if(ignore!=='design'&&!F.design.has(s.de))return false;
  return true;
}
function setView(v){
  VIEW=v;
  CAPS=A.views[v].map(c=>({id:safe(c.id),raw:c.id,name:c.name,full:c.full||c.name,subs:c.subs.map(s=>({id:safe(s.id),raw:s.id,name:s.name,n:0}))}));
  byCap={};CAPS.forEach(c=>byCap[c.id]=c);
  STUDIES=A.studies.map(x=>{
    const cap=safe(v==='v2'?x.c2:x.c1),sub=safe(v==='v2'?x.s2:x.s1),a=v==='v2'&&x.a2?{cap:safe(x.a2.c),sub:safe(x.a2.s)}:null;
    return Object.assign({},x,{cap,sub,also:a});
  });
  BYSUB={};STUDIES.forEach(s=>{const k=s.cap+'/'+s.sub;(BYSUB[k]=BYSUB[k]||[]).push(s);const c=byCap[s.cap];if(c){const u=c.subs.find(q=>q.id===s.sub);if(u)u.n++}});
  S.cap=null;S.sub=null;viewKey='';
  $('#v2b').setAttribute('aria-pressed',v==='v2');$('#v1b').setAttribute('aria-pressed',v==='v1');
  readColors();render();
}
const capOf=id=>byCap[id];
const dirLabel=id=>DIRS.find(d=>d.id===id).label;

/* ---------- colours ---------- */
const COL={};let dirty=true;
function isDark(){const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function capColor(c,i){
  if(c.raw==='NE')return isDark()?'#a7b0c0':'#5a6f92';
  const h=Math.round((i*137.508+24)%360);return isDark()?`hsl(${h} 66% 66%)`:`hsl(${h} 58% 42%)`;
}
function readColors(){
  const cs=getComputedStyle(document.documentElement);
  ['bg','ink','muted','line'].forEach(k=>COL[k]=cs.getPropertyValue('--'+k).trim());
  DIRS.forEach(d=>COL['d-'+d.id]=cs.getPropertyValue('--d-'+d.id).trim());
  CAPS.forEach((c,i)=>{COL['c-'+c.id]=capColor(c,i);document.documentElement.style.setProperty('--c-'+c.id,COL['c-'+c.id])});
  dirty=true;
}

/* ---------- graph (canvas) ---------- */
const W=700,CX=350,CY=350,TAU=Math.PI*2,K=W/400;
let G=null,theta=0,rotating=!matchMedia('(prefers-reduced-motion: reduce)').matches,hover=false,last=0,scale=1,dpr=1,viewKey='';
const cv=$('#cv'),ctx=cv.getContext('2d');
const FONT='"Figtree","Segoe UI",system-ui,sans-serif';
const sf=k=>{const a=k*2.399963,r=Math.sqrt(k+.5);return[Math.cos(a)*r,Math.sin(a)*r]};
const polar=(cx,cy,r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
const dotCol=(s,mode)=>(S.colour==='dir'||mode==='sub')?'d-'+s.dir:'c-'+s.cap;

function buildGraph(cap,sub){
  const g={mode:sub?'sub':cap?'cap':'all',hubs:[],subs:[],dots:[],outer:[],arcs:[],capId:cap?cap.id:null,subName:sub?sub.name:''};
  const subById={},outerById={};
  const nC=CAPS.length;
  if(g.mode==='all'){
    const ringR=(nC>8?232:200);
    CAPS.forEach((c,ci)=>{
      const ha=-Math.PI/2+ci*TAU/nC,p=polar(CX,CY,ringR,ha);
      const hub={id:c.id,x:p[0],y:p[1],name:c.name};g.hubs.push(hub);
      const m=c.subs.length,sr=m<=1?34:m<=3?42:m<=5?52:58;
      c.subs.forEach((s,j)=>{
        const a=m===1?ha+Math.PI:ha+Math.PI/m+j*TAU/m,q=polar(p[0],p[1],sr,a);
        const node={id:s.id,cap:c.id,x:q[0],y:q[1],n:s.n,name:s.name,hub};
        g.subs.push(node);subById[c.id+'/'+s.id]=node;
        (BYSUB[c.id+'/'+s.id]||[]).forEach((st,k)=>{const u=sf(k);g.dots.push({s:st,x:q[0]+u[0]*3.1,y:q[1]+u[1]*3.1,r:2.5,home:node,live:passes(st)})});
      });
    });
  }else if(g.mode==='cap'){
    const hub={id:cap.id,x:CX,y:CY,name:cap.name};g.hubs.push(hub);
    const m=cap.subs.length,R0=m<=1?0:m<=3?150:m<=5?170:182;
    cap.subs.forEach((s,j)=>{
      const a=-Math.PI/2+j*TAU/Math.max(m,1),cr=s.n?7.2*Math.sqrt(s.n)+5:20,q=polar(CX,CY,R0,a),lp=polar(CX,CY,R0+cr+26,a);

  }else{

  }

function rot(x,y){const dx=x-CX,dy=y-CY,c=Math.cos(theta),s=Math.sin(theta);return[CX+dx*c-dy*s,CY+dx*s+dy*c]}

function halo(text,x,y,font,fill,align){ctx.font=font;ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle=COL.bg;ctx.strokeText(text,x,y);ctx.fillStyle=fill;ctx.fillText(text,x,y)}

function draw(t){

    const mx=(d.rx+d.tgt.rx)/2,my=(d.ry+d.tgt.ry)/2,cx=mx+(CX-mx)*0.38,cy=my+(CY-my)*0.38;

  }else{
    ctx.lineWidth=0.8;
    g.dots.forEach(d=>{ctx.globalAlpha=age*(d.live?0.16:0.05);ctx.strokeStyle=COL['d-'+d.s.dir];ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(d.rx,d.ry);ctx.stroke()});
    g.arcs.forEach(a=>{ctx.globalAlpha=age;ctx.strokeStyle=COL['d-'+a.d.id];ctx.lineWidth=6;ctx.beginPath();ctx.arc(CX,CY,g.Rm+22,a.a0+theta+0.02,a.a1+theta-0.02);ctx.stroke()});
  }
  g.dots.forEach(d=>dotPaint(d,age));
  ctx.globalAlpha=age;
  g.subs.forEach(s=>{
    if(!s.n){ctx.globalAlpha=age*0.6;ctx.strokeStyle=COL['c-'+s.cap];ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(s.rx,s.ry,g.mode==='cap'?20:11,0,TAU);ctx.stroke();ctx.setLineDash([])}
    else{ctx.globalAlpha=age;ctx.fillStyle=COL['c-'+s.cap];ctx.strokeStyle=COL.bg;ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.rx,s.ry,g.mode==='cap'?8:4.5,0,TAU);ctx.fill();ctx.stroke();
      if(g.mode==='cap'){ctx.globalAlpha=age*0.22;ctx.strokeStyle=COL['c-'+s.cap];ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(s.rx,s.ry,s.cr,0,TAU);ctx.stroke()}}
  });
  g.hubs.forEach(h=>{ctx.globalAlpha=age;ctx.fillStyle=COL['c-'+h.id];ctx.strokeStyle=COL.bg;ctx.lineWidth=3;ctx.beginPath();ctx.arc(h.rx,h.ry,g.mode==='cap'?20:11,0,TAU);ctx.fill();ctx.stroke()});
  g.outer.forEach(o=>{ctx.globalAlpha=age;ctx.fillStyle=COL['c-'+o.id];ctx.strokeStyle=COL.bg;ctx.lineWidth=3;ctx.beginPath();ctx.arc(o.rx,o.ry,o.r,0,TAU);ctx.fill();ctx.stroke();
    if(o.own){ctx.strokeStyle=COL['c-'+o.id];ctx.lineWidth=2;ctx.beginPath();ctx.arc(o.rx,o.ry,o.r+5,0,TAU);ctx.stroke()}});

    g.hubs.forEach(h=>{ctx.font='700 17px '+FONT;const ls=wrap(h.name,120);ls.forEach((l,i)=>halo(l,h.rx,h.ry+36+i*18,'700 17px '+FONT,COL.ink))});
    g.subs.forEach(s=>{
      ctx.font='600 13px '+FONT;
      const lines=wrap(s.name,118).slice(0,3),h=15,y0=s.rly-((lines.length)*h)/2;
      lines.forEach((l,i)=>halo(l,s.rlx,y0+i*h+h/2,'600 13px '+FONT,COL.ink));

    });
    g.outer.forEach(o=>halo(o.name,o.rx,o.ry+20,'500 12px '+FONT,COL.muted));
  }else{
    ctx.font='700 16px '+FONT;
    const lines=wrap(g.subName,140),h=19,y0=CY-(lines.length*h)/2-8;
    lines.forEach((l,i)=>halo(l,CX,y0+i*h+h/2,'700 16px '+FONT,COL.ink));
    halo(g.dots.length+(g.dots.length===1?' study':' studies'),CX,y0+lines.length*h+h/2+4,'400 12px '+FONT,COL.muted);
    g.arcs.forEach(a=>{const mid=(a.a0+a.a1)/2+theta,p=polar(CX,CY,g.Rm+48,mid);halo(a.d.label+' '+a.count,p[0],p[1],'600 12px '+FONT,COL.ink)});
    g.outer.forEach(o=>halo(o.name,o.rx,o.ry+(o.own?24:20),'500 12px '+FONT,o.own?COL.ink:COL.muted));

}
function frame(t){
  const dt=Math.min(64,t-last);last=t;
  if(rotating&&!hover&&!document.hidden){theta+=dt*0.000055;dirty=true}
  if(G&&(dirty||t-G.t0<400)){draw(t);dirty=false}
  requestAnimationFrame(frame);
}
function hitTest(x,y){
  const g=G;if(!g||!g.all[0]||g.all[0].rx===undefined)return null;
  const d=n=>Math.hypot(n.rx-x,n.ry-y);
  if(g.mode==='sub'){
    let best=null,bd=14;g.dots.forEach(n=>{const k=d(n);if(k<bd){bd=k;best={card:n.s.id}}});
    if(best)return best;
    for(const o of g.outer)if(d(o)<22)return{go:'cap:'+o.id};
    if(Math.hypot(x-CX,y-CY)<50)return{go:'cap:'+g.capId};
    return null;
  }
  if(g.mode==='cap'){
    for(const o of g.outer)if(d(o)<22)return{go:'cap:'+o.id};
    for(const s of g.subs)if(d(s)<s.cr+12)return{go:'sub:'+g.capId+':'+s.id};
    if(Math.hypot(x-CX,y-CY)<36)return{go:'root'};
    return null;
  }
  let best=null,bd=80;
  g.hubs.forEach(h=>{const k=d(h);if(k<bd){bd=k;best={go:'cap:'+h.id}}});
  g.subs.forEach(s=>{const k=d(s)*0.9;if(k<bd){bd=k;best={go:'cap:'+s.cap}}});
  return best;
}
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*W]}
cv.addEventListener('click',e=>{
  const p=pt(e),h=hitTest(p[0],p[1]);if(!h)return;
  if(h.go)navigate(h.go);
  else if(h.card){const el=document.getElementById('card-'+h.card);
    if(el){el.style.setProperty('--fc',COL.ink);el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}
});

/* ---------- panels ---------- */
function tally(arr){const c={};DIRS.forEach(d=>c[d.id]=0);arr.forEach(s=>c[s.dir]++);return c}
function statsBlock(arr,scopeLen,color,scope){
  const c=tally(arr),n=arr.length;
  const chips=DIRS.map(d=>`<div class="stat" title="${esc(d.sub)}"><b>${c[d.id]}</b><span><i class="${d.id==='unk'?'unk':''}" style="background:var(--d-${d.id})"></i>${d.label}</span></div>`).join('');
  const bar=n?DIRS.map(d=>c[d.id]?`<i class="${d.id==='unk'?'unk':''}" title="${d.label}: ${c[d.id]}" style="flex:${c[d.id]};background:var(--d-${d.id})"></i>`:'').join(''):'';
  const keyOf=y=>y<1990?Math.floor(y/10)*10:y;const b={};arr.forEach(s=>{const k=keyOf(s.y);b[k]=(b[k]||0)+1});
  const lo=keyOf(Y0),keys=[];for(let k=lo;k<=Y1;k=k<1990?k+10:k+1)keys.push(k);
  const hm=Math.max(1,...keys.map(k=>b[k]||0));
  const bars=keys.map(k=>{const v=b[k]||0,lbl=k<1990?k+'s':k;return `<i class="${v?'':'z'}" style="height:${v?Math.max(6,v/hm*100):4}%" title="${lbl}: ${v}"></i>`}).join('');
  let note='';
  const sep=scope.filter(s=>!F.design.has(s.de)&&passes(s,'design')).length;
  if(sep)note=`<p class="note">${sep} review${sep===1?'':'s'}, commentary and technical paper${sep===1?'':'s'} counted separately. <button data-act="reviews">Include</button></p>`;
  return `<section class="stats" style="--hc:${color}" aria-label="Summary">
    <div class="total"><span class="big">${n}</span><span>${n===1?'study':'studies'}</span><span class="of">of ${scopeLen} in scope</span></div>
    <div class="chips">${chips}</div>
    <div class="stackbar" role="img" aria-label="${DIRS.map(d=>d.label+' '+c[d.id]).join(', ')}">${bar}</div>
    <div class="hist" aria-label="Studies per year"><div class="bars">${bars}</div><div class="ax"><span>${lo<1990?lo+'s':lo}</span><span>studies per year</span><span>${Y1}</span></div></div>
    ${note}</section>`;
}
function card(s){
  const tags=[ST[s.st]||s.st,AIN[s.ai]||s.ai];
  if(s.hf&&s.hf!=='none')tags.push(s.hf);
  if(s.pop&&s.pop!=='none')tags.push(s.pop);
  if(s.set&&s.set!=='none')tags.push(s.set);
  if(s.lang!=='en')tags.push('Language: '+s.lang);
  const link=s.d?`https://doi.org/${s.d}`:null;
  const also=s.al?`<div class="meta">Also touches ${esc(s.al)}</div>`:'';
  return `<li class="card" id="card-${s.id}">
    <h3>${link?`<a href="${esc(link)}" target="_blank" rel="noopener">${esc(s.t)}</a>`:esc(s.t)}</h3>
    <div class="meta">${s.y} · ${DES[s.de]||s.de}${s.a?` · ${esc(s.a)}`:''}${s.v?`<br>${esc(s.v)}`:''}</div>
    <div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${also}
    <span class="ai">AI-coded · not yet verified${s.cf?' · confidence '+({l:'low',m:'medium',h:'high'})[s.cf]:''}</span>
    <div class="meta">${s.id} · topic cluster: ${esc(s.v1)}</div></li>`;
}

/* ---------- render ---------- */
function render(){
  const cap=capOf(S.cap),sub=cap&&cap.subs.find(s=>s.id===S.sub);
  const scope=STUDIES.filter(s=>(!cap||s.cap===cap.id)&&(!sub||s.sub===sub.id));
  const arr=scope.filter(s=>passes(s));
  const color=cap?`var(--c-${cap.id})`:'var(--ink)';
  let crumbs;
  const rootName=VIEW==='v2'?'All areas':'All topics';
  if(!cap)crumbs=`<span class="here">${rootName}</span>`;
  else if(!sub)crumbs=`<button data-go="root">${rootName}</button><span class="sep">›</span><span class="here">${esc(cap.name)}</span>`;
  else crumbs=`<button data-go="root">${rootName}</button><span class="sep">›</span><button data-go="cap:${cap.id}">${esc(cap.name)}</button><span class="sep">›</span><span class="here">${esc(sub.name)}</span>`;
  $('#crumbs').innerHTML=crumbs;
  const title=sub?sub.name:cap?cap.full:(VIEW==='v2'?`${CAPS.length} areas that emerged`:`${CAPS.length} topic clusters`);
  let line;
  if(!cap)line=VIEW==='v2'?'Groups of studies by what they say about people. Tap one to open it.':'Automatic clusters by topic and technology; the smaller ones are folded into Other topics. Tap one to open it.';
  else if(!sub)line=`${cap.subs.length} sub-area${cap.subs.length===1?'':'s'}. Tap one to read the studies.`;
  else line='Grouped by effect, newest first.';
  $('#head').innerHTML=`<h2 class="title" style="--c:${color}">${cap?'<i></i>':''}${esc(title)}</h2><p class="sub">${line}</p>`;
  $('#stats').innerHTML=statsBlock(arr,scope.length,color,scope);
  const key=VIEW+'|'+S.cap+'/'+S.sub;
  G=buildGraph(cap,sub);G.t0=(key===viewKey&&window.__t0)?window.__t0:performance.now();
  if(key!==viewKey){window.__t0=G.t0;viewKey=key}
  $('#gcap').textContent=!cap?(VIEW==='v2'?'Each dot is a study. Lines join studies that also bear on another area.':'Each dot is a study. In this view groups are automatic topic clusters; no cross-lines are drawn.')
    :!sub?(VIEW==='v2'?'Outer dots are the other areas. Lines show studies that also bear on them.':'Outer dots are the other clusters.')
    :'Dots are grouped by effect. Tap a dot to jump to its card.';
  const dl=$('#dlg');dl.hidden=!(S.colour==='dir'||sub);
  dl.innerHTML=DIRS.map(d=>`<span><i class="${d.id==='unk'?'unk':''}" style="background:var(--d-${d.id})"></i>${d.label}</span>`).join('');
  let lg;
  if(!cap)lg=CAPS.map(c=>({go:'cap:'+c.id,col:c.id,name:c.name,n:STUDIES.filter(s=>s.cap===c.id&&passes(s)).length,base:c.subs.reduce((a,s)=>a+s.n,0),on:false}));
  else lg=cap.subs.map(s=>({go:`sub:${cap.id}:${s.id}`,col:cap.id,name:s.name,n:(BYSUB[cap.id+'/'+s.id]||[]).filter(x=>passes(x)).length,base:s.n,on:!!sub&&sub.id===s.id}));
  $('#legend').innerHTML=lg.map(i=>`<button class="lg${i.on?' on':''}${i.base===0?' zero':''}" style="--c:var(--c-${i.col})" data-go="${i.go}"><i></i>${esc(i.name)} <b>${i.n}</b></button>`).join('');
  let cards='';
  if(sub){
    if(!arr.length)cards=`<div class="empty"><b>No studies match these filters</b><span>Widen the years or turn a filter back on.</span><button data-act="reset">Reset filters</button></div>`;
    else DIRS.forEach(d=>{
      const items=arr.filter(s=>s.dir===d.id).sort((a,b)=>b.y-a.y||a.id.localeCompare(b.id));
      if(!items.length)return;
      cards+=`<h3 class="gh"><i class="${d.id==='unk'?'unk':''}" style="background:var(--d-${d.id})"></i>${d.id==='unk'?'Not stated in the text':d.label}<span>${items.length}</span></h3><ul class="list">${items.map(card).join('')}</ul>`;
    });
  }
  $('#cards').innerHTML=cards;
  syncFilterUI();dirty=true;
}

/* ---------- filters ---------- */
function buildFilters(){
  let h=`<fieldset class="fs"><legend>Year published <output id="yr"></output></legend>
    <div class="years"><label>From<input type="range" id="yfrom" min="${Y0}" max="${Y1}" step="1"></label>
    <label>To<input type="range" id="yto" min="${Y0}" max="${Y1}" step="1"></label></div></fieldset>`;
  GROUPS.forEach((g,i)=>{
    h+=`<details class="grp"${i<3?' open':''}><summary>${g[1]}<span class="cnt" id="cnt-${g[0]}"></span></summary>
      <div class="chips-row">${OPTS[g[0]].map(o=>`<label class="chip"><input type="checkbox" data-g="${g[0]}" value="${o[0]}"><span>${o[1]} · ${o[2]}</span></label>`).join('')}</div></details>`;
  });
  h+=`<p class="hint">Age group, region, funding and sample size are not coded yet, so they are not offered as filters.</p><button class="reset" data-act="reset">Reset all filters</button>`;
  $('#filters').innerHTML=h;
}
function syncFilterUI(){
  document.querySelectorAll('#filters input[data-g]').forEach(i=>{i.checked=F[i.dataset.g].has(i.value)});
  GROUPS.forEach(g=>{const e=$('#cnt-'+g[0]);if(e)e.textContent=F[g[0]].size+'/'+OPTS[g[0]].length});
  const yf=$('#yfrom'),yt=$('#yto');
  if(yf){yf.value=F.from;yt.value=F.to;$('#yr').textContent=F.from===F.to?F.from:F.from+'–'+F.to}
  const n=activeCount(),fc=$('#fcount');fc.textContent=n;fc.hidden=n===0;
  $('#showing').textContent=STUDIES.filter(s=>passes(s)).length+' of '+STUDIES.length+' studies';
}
function navigate(go){
  const p=go.split(':');
  if(p[0]==='root'){S.cap=null;S.sub=null}else if(p[0]==='cap'){S.cap=p[1];S.sub=null}else{S.cap=p[1];S.sub=p[2]}
  render();
  $('#crumbs').scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){navigate(g.dataset.go);return}
  const a=e.target.closest('[data-act]');
  if(a){if(a.dataset.act==='reset')resetF();if(a.dataset.act==='reviews')SEPARATE.forEach(v=>F.design.add(v));render()}
});
$('#fbtn').addEventListener('click',()=>{const p=$('#filters'),open=p.hidden;p.hidden=!open;$('#fbtn').setAttribute('aria-expanded',String(open))});
$('#filters').addEventListener('change',e=>{const t=e.target;if(t.dataset.g){t.checked?F[t.dataset.g].add(t.value):F[t.dataset.g].delete(t.value)}render()});
$('#filters').addEventListener('input',e=>{const t=e.target;if(t.id==='yfrom'){F.from=Math.min(+t.value,F.to);render()}if(t.id==='yto'){F.to=Math.max(+t.value,F.from);render()}});
$('#v2b').onclick=()=>setView('v2');$('#v1b').onclick=()=>setView('v1');
$('#cArea').onclick=()=>{S.colour='area';$('#cArea').setAttribute('aria-pressed',true);$('#cDir').setAttribute('aria-pressed',false);render()};
$('#cDir').onclick=()=>{S.colour='dir';$('#cDir').setAttribute('aria-pressed',true);$('#cArea').setAttribute('aria-pressed',false);render()};
(function(){const b=$('#theme'),modes=['auto','light','dark'];let cur='auto';try{cur=localStorage.getItem('aha-theme')||'auto'}catch(e){}
  function ap(){if(cur==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',cur);b.textContent=cur[0].toUpperCase()+cur.slice(1)}
  ap();b.onclick=()=>{cur=modes[(modes.indexOf(cur)+1)%3];try{localStorage.setItem('aha-theme',cur)}catch(e){}ap()}})();
$('#foot').textContent=A.note+' Direction and study type were coded by Claude from the title and abstract and have not been checked by a person; where the text does not say, the study is marked "not stated". Group names and the placement of studies are automatic first drafts. Reviews, commentary and technical papers are counted separately by default.';
buildOpts();resetF();buildFilters();
if(!rotating){$('#rot').textContent='Rotate';$('#rot').setAttribute('aria-pressed','false')}
setView('v2');sizeCanvas();
requestAnimationFrame(frame);
})();
</script>
</body>
