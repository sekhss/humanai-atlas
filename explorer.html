<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas of Humans and AI: group explorer</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb; --surface-2: #f3f2ef; --line: #dcdbd6; --line-strong: #b9b8b1;
  --text: #0b0b0b; --text-2: #52514e; --accent: #2a78d6; --accent-ink: #ffffff;
  --seq-0: #cde2fb; --seq-1: #86b6ef; --seq-2: #3987e5; --seq-3: #256abf; --seq-4: #184f95; --seq-5: #0d366b;
  --neutral-node: #e4e3de;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface: #1a1a19; --surface-2: #252523; --line: #3a3a37; --line-strong: #5a5a55;
    --text: #f0efec; --text-2: #c3c2b7; --accent: #3987e5; --accent-ink: #0b0b0b;
    --seq-0: #184f95; --seq-1: #1c5cab; --seq-2: #256abf; --seq-3: #3987e5; --seq-4: #6da7ec; --seq-5: #9ec5f4;
    --neutral-node: #34342f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19; --surface-2: #252523; --line: #3a3a37; --line-strong: #5a5a55;
  --text: #f0efec; --text-2: #c3c2b7; --accent: #3987e5; --accent-ink: #0b0b0b;
  --seq-0: #184f95; --seq-1: #1c5cab; --seq-2: #256abf; --seq-3: #3987e5; --seq-4: #6da7ec; --seq-5: #9ec5f4;
  --neutral-node: #34342f;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--surface); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
header, main { padding: 0 16px; max-width: 1400px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-top: 16px; padding-bottom: 8px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
.sub { color: var(--text-2); font-size: 13px; flex: 1 1 320px; }
button, select, input[type="search"] { font: inherit; color: var(--text); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
button { cursor: pointer; }
button:hover { border-color: var(--line-strong); }
button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; padding: 7px 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 8px 0 12px; border-bottom: 1px solid var(--line); }
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.group > .lab { color: var(--text-2); font-size: 12px; margin-right: 2px; }
.chip { border-radius: 999px; padding: 4px 11px; font-size: 13px; background: transparent; border: 1px solid var(--line); }
.chip[aria-pressed="true"] { background: var(--surface-2); border-color: var(--line-strong); font-weight: 600; }
.chip[aria-pressed="true"]::before { content: "\2713\00a0"; }
label.sw { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
.status { color: var(--text-2); font-size: 13px; margin-left: auto; }
.app { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(320px, 0.9fr); gap: 16px; padding-top: 12px; padding-bottom: 32px; }
@media (max-width: 920px) { .app { grid-template-columns: 1fr; } }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 13px; margin-bottom: 6px; min-height: 26px; }
.crumbs button { padding: 2px 8px; border-radius: 6px; font-size: 13px; }
.crumbs .sep { color: var(--text-2); }
.stage { position: relative; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
svg#net { display: block; width: 100%; height: 600px; touch-action: manipulation; }
@media (max-width: 920px) { svg#net { height: 460px; } }
.node { cursor: pointer; }
.node circle { stroke: var(--surface); stroke-width: 2; }
.node:hover circle, .node:focus-visible circle { stroke: var(--text); }
.node.gap circle { fill: var(--neutral-node) !important; stroke: var(--line-strong); stroke-dasharray: 3 3; }
.node.sel circle { stroke: var(--text); stroke-width: 3; }
.node text { fill: var(--text); font-size: 12px; pointer-events: none; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.node.gap text { fill: var(--text-2); }
.link { stroke: var(--line-strong); fill: none; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 4px; font-size: 12px; color: var(--text-2); }
.legend .ramp { width: 120px; height: 10px; border-radius: 5px;
  background: linear-gradient(90deg, var(--seq-0), var(--seq-1), var(--seq-2), var(--seq-3), var(--seq-4), var(--seq-5)); }
.legend .dash { width: 14px; height: 14px; border-radius: 50%; border: 2px dashed var(--line-strong); display: inline-block; vertical-align: middle; }
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line-strong);
  border-radius: 8px; padding: 8px 10px; font-size: 12.5px; max-width: 280px; box-shadow: 0 4px 16px rgba(0,0,0,.18); display: none; }
.tip b { display: block; margin-bottom: 2px; }
.panel { min-width: 0; }
.panel h2 { font-size: 17px; margin: 0 0 4px; }
.panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-2); margin: 16px 0 6px; font-weight: 600; }
.phrases { display: flex; flex-wrap: wrap; gap: 6px; }
.phrases span { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.rel { display: flex; flex-direction: column; gap: 4px; }
.rel button { text-align: left; font-size: 13px; padding: 5px 9px; }
.rel small { color: var(--text-2); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--text-2); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--surface); }
td.num, th.num { text-align: right; white-space: nowrap; }
.works { max-height: 520px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
.works td small { color: var(--text-2); display: block; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); margin-right: 4px; color: var(--text-2); white-space: nowrap; }
details.tablev { margin-top: 10px; }
details.tablev summary { cursor: pointer; font-size: 13px; color: var(--text-2); }
.note { color: var(--text-2); font-size: 12.5px; margin: 8px 0; }
svg.hist { width: 100%; height: 72px; display: block; }
.hist rect { fill: var(--accent); }
.hist rect:hover { opacity: .7; }
.hist text { fill: var(--text-2); font-size: 10px; }
.empty { color: var(--text-2); padding: 16px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1><a href="index.html" style="color:inherit;text-decoration:none">Atlas of Humans &times; AI</a> <small style="font-weight:400;color:var(--text-2)">group explorer</small></h1>
  <div class="sub" id="sub">A sample of studies on how AI affects people.</div>
  <div class="seg" role="group" aria-label="View">
    <button id="v2btn" aria-pressed="true" title="Groups works by the human capacity or outcome they concern">Human focus</button>
    <button id="v1btn" aria-pressed="false" title="Groups works by topic and technology (automatic clustering)">Topic &amp; technology</button>
  </div>
  <button id="theme" aria-label="Switch colour theme">Theme: auto</button>
</header>
<main>
  <div class="toolbar" id="toolbar">
    <div class="group" id="eraG"><span class="lab">Era</span></div>
    <div class="group" id="invG"><span class="lab">Role of AI</span></div>
    <details class="group" id="aiD"><summary class="lab" style="cursor:pointer">AI type</summary><div class="group" id="aiG"></div></details>
    <label class="sw"><input type="checkbox" id="nonEn" checked> Non-English</label>
    <label class="sw"><input type="checkbox" id="noAI" checked> Works without AI</label>
    <label class="sw">Smallest group shown
      <select id="minN" aria-label="Smallest group shown"><option>1</option><option>2</option><option>3</option><option>5</option><option>10</option></select></label>
    <input type="search" id="q" placeholder="Search titles and topics" aria-label="Search titles and topics" size="22">
    <span class="status" id="status" role="status"></span>
  </div>
  <div class="app">
    <section aria-label="Network of groups">
      <div class="crumbs" id="crumbs"></div>
      <div class="stage"><svg id="net" role="img" aria-label="Network of groups of studies"></svg></div>
      <div class="note" id="hiddenNote"></div>
      <div class="legend">
        <span>Fill = share of works studying AI's effect on people</span>
        <span>0%</span><span class="ramp"></span><span>80%+</span>
        <span><span class="dash"></span> no works under the current filters (a gap)</span>
        <span>Size = number of works. Lines join similar groups.</span>
      </div>
      <details class="tablev" id="tableDet" open><summary>Groups at this level (table)</summary><div id="grpTable"></div></details>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</main>
<div class="tip" id="tip"></div>
<script src="vendor/d3.min.js"></script>
<script src="dataset_v2.js"></script>
<script>
(function () {
  "use strict";
  var D = window.AHA_DATA;
  var ERA = [["symbolic", "to 2009"], ["ml", "2010-2021"], ["genai", "2022 on"]];
  var INV = [["effect_on_people", "Affects people"], ["people_use_ai", "People use AI"], ["ai_for_people", "AI built for people"], ["ai_only", "AI only"], ["other", "Other"]];
  var AIN = { llm: "Language model", gen: "Generative", rec: "Recommender", dec: "Decision aid / expert system", comp: "Chatbot / companion / affective",
              tutor: "Tutoring", auto: "Automation", robot: "Robot", other: "Other AI", none: "No AI" };
  var INVN = {}; INV.forEach(function (x) { INVN[x[0]] = x[1]; });
  var st = { view: "v2", era: new Set(ERA.map(function (x) { return x[0]; })), inv: new Set(INV.map(function (x) { return x[0]; })),
             ai: null, nonEn: true, noAI: true, minN: 1, q: "", focus: null, sel: null, shown: 40 };
  var T = {}, byId = {}, parentOf = {}, workById = {}, linkMap = {};
  var tip, svg, sim, pos = {};

  function boot() {
    document.getElementById("sub").textContent = D.note + " Names are drafts written by Claude.";
    D.works.forEach(function (w) { workById[w.id] = w; });
    st.ai = new Set(D.facets.ai);
    buildIndex();
    buildToolbar();
    tip = document.getElementById("tip");
    svg = d3.select("#net");
    document.getElementById("v2btn").onclick = function () { setView("v2"); };
    document.getElementById("v1btn").onclick = function () { setView("v1"); };
    initTheme();
    var rs; window.addEventListener("resize", function () { clearTimeout(rs); rs = setTimeout(render, 150); });
    render();
  }

  function treeOf() { return st.view === "v2" ? D.tree : D.tree1; }
  function linksOf() { return st.view === "v2" ? D.links : D.links1; }
  function nodeKey(w) { return st.view === "v2" ? w.n : w.n1; }

  function buildIndex() {
    ["v2", "v1"].forEach(function (v) {
      var tree = v === "v2" ? D.tree : D.tree1; byId[v] = {}; parentOf[v] = {}; linkMap[v] = {};
      (function walk(ns, par) { ns.forEach(function (n) { byId[v][n.id] = n; parentOf[v][n.id] = par; walk(n.children, n.id); }); })(tree, null);
      (v === "v2" ? D.links : D.links1).forEach(function (l) {
        (linkMap[v][l.a] = linkMap[v][l.a] || []).push({ id: l.b, s: l.s });
        (linkMap[v][l.b] = linkMap[v][l.b] || []).push({ id: l.a, s: l.s });
      });
    });
  }
  function ancestors(id) { var out = [], p = parentOf[st.view]; while (id) { out.push(id); id = p[id]; } return out; }

  function setView(v) {
    st.view = v; st.focus = null; st.sel = null; st.shown = 40; pos = {};
    document.getElementById("minN").value = v === "v1" ? "5" : "1"; st.minN = v === "v1" ? 5 : 1;
    document.getElementById("v2btn").setAttribute("aria-pressed", v === "v2");
    document.getElementById("v1btn").setAttribute("aria-pressed", v === "v1");
    render();
  }

  function chip(parent, label, on, cb, title) {
    var b = document.createElement("button"); b.className = "chip"; b.textContent = label; b.setAttribute("aria-pressed", on);
    if (title) b.title = title;
    b.onclick = function () { var now = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", now); cb(now); };
    parent.appendChild(b); return b;
  }
  function buildToolbar() {
    ERA.forEach(function (e) { chip(document.getElementById("eraG"), e[0] === "symbolic" ? "to 2009" : e[0] === "ml" ? "2010–2021" : "2022 on", true,
      function (on) { on ? st.era.add(e[0]) : st.era.delete(e[0]); st.shown = 40; render(); }); });
    INV.forEach(function (e) { chip(document.getElementById("invG"), e[1], true,
      function (on) { on ? st.inv.add(e[0]) : st.inv.delete(e[0]); st.shown = 40; render(); }); });
    D.facets.ai.forEach(function (a) { chip(document.getElementById("aiG"), AIN[a] || a, true,
      function (on) { on ? st.ai.add(a) : st.ai.delete(a); st.shown = 40; render(); }); });
    document.getElementById("nonEn").onchange = function (e) { st.nonEn = e.target.checked; st.shown = 40; render(); };
    document.getElementById("noAI").onchange = function (e) { st.noAI = e.target.checked; st.shown = 40; render(); };
    document.getElementById("minN").onchange = function (e) { st.minN = +e.target.value; render(); };
    var t; document.getElementById("q").oninput = function (e) { clearTimeout(t); t = setTimeout(function () { st.q = e.target.value.trim().toLowerCase(); st.shown = 40; render(); }, 180); };
  }

  function passes(w) {
    if (!st.era.has(w.e)) return false;
    if (!st.inv.has(w.inv)) return false;
    if (!st.ai.has(w.ai)) return false;
    if (!st.nonEn && w.lang !== "en") return false;
    if (!st.noAI && w.ai === "none") return false;
    if (st.q && (w.t + " " + w.hf + " " + w.pop + " " + w.set).toLowerCase().indexOf(st.q) < 0) return false;
    return true;
  }

  var C; // counts for the current view/filters
  function compute() {
    C = {}; var fw = [];
    D.works.forEach(function (w) {
      if (!passes(w)) return;
      fw.push(w);
      ancestors(nodeKey(w)).forEach(function (id) {
        var c = C[id] || (C[id] = { n: 0, eff: 0 }); c.n++; if (w.inv === "effect_on_people") c.eff++;
      });
    });
    return fw;
  }
  function nf(id) { return C[id] ? C[id].n : 0; }

  var seq = d3.scaleLinear().domain([0, 0.16, 0.32, 0.48, 0.64, 0.8]).range([0, 1, 2, 3, 4, 5]).clamp(true);
  function fillFor(id) {
    var c = C[id]; if (!c || !c.n) return "var(--neutral-node)";
    var i = Math.round(seq(c.eff / c.n)); return "var(--seq-" + i + ")";
  }
  function isDarkTheme() {
    var t = document.documentElement.getAttribute("data-theme");
    return t ? t === "dark" : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }
  function wrap(name, max) {
    var words = name.split(/\s+/), lines = [], cur = "";
    words.forEach(function (w) { if ((cur + " " + w).trim().length > max && cur) { lines.push(cur); cur = w; } else cur = (cur + " " + w).trim(); });
    if (cur) lines.push(cur); if (lines.length > 3) { lines = lines.slice(0, 3); lines[2] += "…"; }
    return lines;
  }
  function showTip(ev, n) {
    var c = C[n.id] || { n: 0, eff: 0 };
    tip.innerHTML = "<b></b>" + c.n + " of " + n.n + " works under the current filters<br>" +
      (c.n ? Math.round(100 * c.eff / c.n) + "% study AI's effect on people" : "No matching works") +
      (n.phrases && n.phrases.length ? "<br><span style='color:var(--text-2)'>" + n.phrases.slice(0, 4).join(", ") + "</span>" : "");
    tip.firstChild.textContent = n.name; tip.style.display = "block";
    var x = ev.clientX || 0, y = ev.clientY || 0;
    if (!ev.clientX && ev.target && ev.target.getBoundingClientRect) { var r = ev.target.getBoundingClientRect(); x = r.right; y = r.top; }
    tip.style.left = Math.min(window.innerWidth - 300, x + 14) + "px"; tip.style.top = Math.max(8, y + 14) + "px";
  }
  function hideTip() { tip.style.display = "none"; }

  function render() {
    var fw = compute();
    document.getElementById("status").textContent = fw.length + " of " + D.works.length + " works match";
    var tree = treeOf();
    var level = st.focus ? byId[st.view][st.focus].children : tree;
    var visible = level.filter(function (n) { return nf(n.id) >= st.minN || (st.minN <= 1 && true); });
    if (st.minN > 1) visible = level.filter(function (n) { return nf(n.id) >= st.minN; });
    renderCrumbs(); renderNet(visible, level.length);
    renderTable(level); renderPanel(fw);
  }

  function renderCrumbs() {
    var el = document.getElementById("crumbs"); el.innerHTML = "";
    function btn(label, id) { var b = document.createElement("button"); b.textContent = label;
      b.onclick = function () { st.focus = id; st.sel = id; st.shown = 40; pos = {}; render(); }; el.appendChild(b); }
    function sep() { var s = document.createElement("span"); s.className = "sep"; s.textContent = "›"; el.appendChild(s); }
    btn(st.view === "v2" ? "All groups (by human focus)" : "All clusters (by topic & technology)", null);
    if (st.focus) { var path = ancestors(st.focus).reverse(); path.forEach(function (id) { sep(); btn(byId[st.view][id].name, id); }); }
  }

  function renderNet(nodes, total) {
    var stage = document.querySelector(".stage"), W = stage.clientWidth || 700, H = parseInt(getComputedStyle(svg.node()).height) || 560;
    svg.attr("viewBox", [0, 0, W, H].join(" ")); svg.selectAll("*").remove();
    if (sim) sim.stop();
    if (!nodes.length) { document.getElementById("hiddenNote").textContent = ""; svg.append("text").attr("x", W / 2).attr("y", H / 2).attr("text-anchor", "middle").attr("fill", "currentColor").text("No groups at this size under the current filters"); return; }
    var maxN = d3.max(nodes, function (n) { return nf(n.id); }) || 1;
    var area = (W * H * 0.34) / Math.max(nodes.length, 4);
    var rMax = Math.min(70, Math.sqrt(area / Math.PI) * 1.5), rMin = 10;
    var rs = d3.scaleSqrt().domain([0, maxN]).range([rMin, rMax]);
    var data = nodes.map(function (n) {
      var p = pos[n.id] || { x: W / 2 + (Math.random() - .5) * W * .5, y: H / 2 + (Math.random() - .5) * H * .5 };
      return { id: n.id, n: n, r: rs(nf(n.id)), x: p.x, y: p.y };
    });
    var idx = {}; data.forEach(function (d) { idx[d.id] = d; });
    var lk = linksOf().filter(function (l) { return idx[l.a] && idx[l.b]; }).map(function (l) { return { source: idx[l.a], target: idx[l.b], s: l.s }; });
    var g = svg.append("g");
    var link = g.selectAll("line.link").data(lk).enter().append("line").attr("class", "link")
      .attr("stroke-width", function (d) { return 0.6 + 2.2 * Math.max(0, d.s - 0.4); }).attr("stroke-opacity", 0.55);
    var node = g.selectAll("g.node").data(data).enter().append("g")
      .attr("class", function (d) { return "node" + (nf(d.id) ? "" : " gap") + (st.sel === d.id ? " sel" : ""); })
      .attr("tabindex", 0).attr("role", "button")
      .attr("aria-label", function (d) { return d.n.name + ", " + nf(d.id) + " works"; })
      .on("mousemove", function (ev, d) { showTip(ev, d.n); }).on("mouseleave", hideTip)
      .on("focus", function (ev, d) { showTip(ev, d.n); }).on("blur", hideTip)
      .on("click", function (ev, d) { activate(d.n); })
      .on("keydown", function (ev, d) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(d.n); } })
      .call(d3.drag().on("start", function (ev, d) { if (!ev.active) sim.alphaTarget(.2).restart(); d.fx = d.x; d.fy = d.y; })
        .on("drag", function (ev, d) { d.fx = ev.x; d.fy = ev.y; })
        .on("end", function (ev, d) { if (!ev.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
    node.append("circle").attr("r", function (d) { return d.r; }).attr("fill", function (d) { return fillFor(d.id); });
    // Labels: inside the circle only when it is big enough; a short label below for the next tier;
    // the rest are shown on hover/focus (and every group is listed in the table).
    var order = data.slice().sort(function (a, b) { return b.r - a.r; }); order.forEach(function (d, i) { d.rank = i; });
    var maxBelow = st.view === "v1" ? 14 : 40;
    node.append("text").attr("text-anchor", "middle").each(function (d) {
      var t = d3.select(this), inside = d.r >= 38, below = !inside && d.r >= 16 && d.rank < maxBelow;
      d.label = inside ? "in" : below ? "below" : "none"; if (!inside && !below) return;
      var lines = wrap(d.n.name, inside ? Math.max(9, Math.floor(d.r * 1.7 / 6.3)) : 17);
      if (!inside && lines.length > 2) { lines = lines.slice(0, 2); lines[1] = lines[1].replace(/\u2026$/, "") + "\u2026"; }
      var y0 = inside ? -((lines.length - 1) * 7) : d.r + 13;
      lines.forEach(function (ln, i) { t.append("tspan").attr("x", 0).attr("y", y0 + i * 13).text(ln); });
      if (!inside) { t.style("fill", "var(--text)"); return; }
      var m = fillFor(d.id).match(/seq-(\d)/), i = m ? +m[1] : -1, dk = isDarkTheme();
      var darkFill = i >= 0 && ((!dk && i >= 3) || (dk && i <= 2));
      t.style("fill", i < 0 ? "var(--text-2)" : (darkFill ? "#ffffff" : "#0b0b0b")).style("stroke", "none");
    });
    sim = d3.forceSimulation(data)
      .force("link", d3.forceLink(lk).distance(function (d) { return 90 + (1 - d.s) * 160; }).strength(0.08))
      .force("charge", d3.forceManyBody().strength(-60))
      .force("center", d3.forceCenter(W / 2, H / 2))
      .force("x", d3.forceX(W / 2).strength(0.06)).force("y", d3.forceY(H / 2).strength(0.08))
      .force("collide", d3.forceCollide(function (d) { return d.r + (d.label === "below" ? 30 : d.label === "in" ? 14 : 6); }).iterations(3))
      .on("tick", function () {
        data.forEach(function (d) { d.x = Math.max(d.r + 4, Math.min(W - d.r - 4, d.x)); d.y = Math.max(d.r + 4, Math.min(H - d.r - (d.label === "below" ? 40 : 8), d.y)); pos[d.id] = { x: d.x, y: d.y }; });
        link.attr("x1", function (d) { return d.source.x; }).attr("y1", function (d) { return d.source.y; })
            .attr("x2", function (d) { return d.target.x; }).attr("y2", function (d) { return d.target.y; });
        node.attr("transform", function (d) { return "translate(" + d.x + "," + d.y + ")"; });
      });
    document.getElementById("hiddenNote").textContent = total > nodes.length ? (total - nodes.length) + " smaller groups are not drawn here; all are listed in the table below." : "";
  }

  function activate(n) {
    st.sel = n.id; st.shown = 40;
    if (n.children && n.children.length) { st.focus = n.id; pos = {}; }
    render();
  }

  function renderTable(level) {
    var rows = level.slice().sort(function (a, b) { return nf(b.id) - nf(a.id); });
    var h = "<table><thead><tr><th>Group</th><th class='num'>Works</th><th class='num'>Affects people</th></tr></thead><tbody>";
    rows.forEach(function (n) {
      var c = C[n.id] || { n: 0, eff: 0 };
      h += "<tr><td><button data-id='" + n.id + "' style='border:0;background:none;padding:0;color:var(--accent);text-align:left'>" + esc(n.name) + "</button></td><td class='num'>" +
        c.n + "</td><td class='num'>" + (c.n ? Math.round(100 * c.eff / c.n) + "%" : "–") + "</td></tr>";
    });
    document.getElementById("grpTable").innerHTML = h + "</tbody></table>";
    document.querySelectorAll("#grpTable button").forEach(function (b) { b.onclick = function () { activate(byId[st.view][b.getAttribute("data-id")]); }; });
  }

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function renderPanel(fw) {
    var el = document.getElementById("panel"), id = st.sel, n = id ? byId[st.view][id] : null;
    var ws = id ? fw.filter(function (w) { return ancestors(nodeKey(w)).indexOf(id) >= 0; }) : fw;
    var h = "<h2>" + esc(n ? n.name : "All works") + "</h2>";
    var c = id ? (C[id] || { n: 0, eff: 0 }) : { n: fw.length, eff: fw.filter(function (w) { return w.inv === "effect_on_people"; }).length };
    h += "<div class='note'>" + c.n + " works match the filters" + (n ? " (" + n.n + " in this group in the sample)" : "") +
      (c.n ? "; " + Math.round(100 * c.eff / c.n) + "% study AI's effect on people." : ".") + "</div>";
    if (n && n.phrases && n.phrases.length) h += "<h3>" + (st.view === "v2" ? "Human focus phrases" : "Keywords") + "</h3><div class='phrases'>" +
      n.phrases.map(function (p) { return "<span>" + esc(p) + "</span>"; }).join("") + "</div>";
    if (n && n.children && n.children.length) h += "<h3>Subgroups</h3><div class='rel'>" + n.children.slice().sort(function (a, b) { return nf(b.id) - nf(a.id); }).slice(0, 12)
      .map(function (k) { return "<button data-go='" + k.id + "'>" + esc(k.name) + " <small>" + nf(k.id) + " works</small></button>"; }).join("") + "</div>";
    var rel = id ? (linkMap[st.view][id] || []).slice().sort(function (a, b) { return b.s - a.s; }).slice(0, 5) : [];
    if (rel.length) h += "<h3>Related groups</h3><div class='rel'>" + rel.map(function (r) {
      return "<button data-go='" + r.id + "'>" + esc(byId[st.view][r.id].name) + " <small>similarity " + r.s.toFixed(2) + "</small></button>"; }).join("") + "</div>";
    h += "<h3>Works by year</h3>" + hist(ws);
    h += "<h3>Works" + (ws.length ? " (" + Math.min(st.shown, ws.length) + " of " + ws.length + ")" : "") + "</h3>";
    if (!ws.length) h += "<div class='empty'>No works match the current filters in this group.</div>";
    else {
      ws = ws.slice().sort(function (a, b) { return b.y - a.y; });
      h += "<div class='works'><table><thead><tr><th>Title</th><th class='num'>Year</th></tr></thead><tbody>";
      ws.slice(0, st.shown).forEach(function (w) {
        var link = w.d ? "https://doi.org/" + w.d : null;
        h += "<tr><td>" + (link ? "<a href='" + esc(link) + "' target='_blank' rel='noopener'>" + esc(w.t) + "</a>" : esc(w.t)) +
          "<small>" + esc(w.a) + (w.v ? " · " + esc(w.v) : "") + "</small>" +
          "<small><span class='tag'>" + esc(w.hf === "none" ? "no human side" : w.hf) + "</span><span class='tag'>" + esc(AIN[w.ai] || w.ai) + "</span><span class='tag'>" + esc(INVN[w.inv] || w.inv) + "</span>" +
          (w.lang !== "en" ? "<span class='tag'>" + esc(w.lang) + "</span>" : "") + "</small>" +
          (st.view === "v2" ? "<small>Topic cluster: " + esc(w.v1) + "</small>" : "<small>Human focus: " + esc(w.hf === "none" ? "none" : w.hf) + "</small>") + "</td><td class='num'>" + w.y + "</td></tr>";
      });
      h += "</tbody></table></div>";
      if (ws.length > st.shown) h += "<p><button id='more'>Show 40 more</button></p>";
    }
    el.innerHTML = h;
    el.querySelectorAll("[data-go]").forEach(function (b) { b.onclick = function () { goTo(b.getAttribute("data-go")); }; });
    var more = document.getElementById("more"); if (more) more.onclick = function () { st.shown += 40; renderPanel(fw); };
    el.querySelectorAll("svg.hist rect").forEach(function (r) {
      r.addEventListener("mousemove", function (ev) { tip.innerHTML = "<b>" + r.getAttribute("data-l") + "</b>" + r.getAttribute("data-n") + " works"; tip.style.display = "block";
        tip.style.left = Math.min(window.innerWidth - 300, ev.clientX + 12) + "px"; tip.style.top = (ev.clientY + 12) + "px"; });
      r.addEventListener("mouseleave", hideTip);
    });
  }

  function goTo(id) { var p = parentOf[st.view][id]; st.focus = p; st.sel = id; st.shown = 40; pos = {}; render(); }

  function hist(ws) {
    if (!ws.length) return "<div class='note'>No works.</div>";
    var bins = {}; ws.forEach(function (w) { var k = w.y < 1990 ? Math.floor(w.y / 10) * 10 : w.y; bins[k] = (bins[k] || 0) + 1; });
    var keys = Object.keys(bins).map(Number).sort(function (a, b) { return a - b; });
    var all = []; var lo = keys[0], hi = keys[keys.length - 1];
    for (var k = lo; k <= hi; k = k < 1990 ? k + 10 : k + 1) all.push(k);
    var mx = d3.max(all, function (k) { return bins[k] || 0; }), W = 320, H = 72, pad = 14, bw = (W - 8) / all.length;
    var h = "<svg class='hist' viewBox='0 0 " + W + " " + H + "' role='img' aria-label='Works by year'>";
    all.forEach(function (k, i) {
      var n = bins[k] || 0, bh = n ? Math.max(2, (H - pad - 4) * n / mx) : 0, x = 4 + i * bw, label = k < 1990 ? k + "s" : String(k);
      if (n) h += "<rect x='" + (x + 1) + "' y='" + (H - pad - bh) + "' width='" + Math.max(1, bw - 2) + "' height='" + bh + "' rx='2' data-l='" + label + "' data-n='" + n + "'><title>" + label + ": " + n + "</title></rect>";
    });
    [lo, hi].forEach(function (k, i) { h += "<text x='" + (i ? W - 4 : 4) + "' y='" + (H - 2) + "' text-anchor='" + (i ? "end" : "start") + "'>" + (k < 1990 ? k + "s" : k) + "</text>"; });
    return h + "</svg>";
  }

  function initTheme() {
    var btn = document.getElementById("theme"), modes = ["auto", "light", "dark"], cur = "auto";
    try { cur = localStorage.getItem("aha-theme") || "auto"; } catch (e) {}
    function apply() { if (cur === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", cur);
      btn.textContent = "Theme: " + cur; }
    apply();
    btn.onclick = function () { cur = modes[(modes.indexOf(cur) + 1) % 3]; try { localStorage.setItem("aha-theme", cur); } catch (e) {} apply(); render(); };
  }
  // start only after all declarations above have run
  if (!D) {
    fetch("dataset_v2.json").then(function (r) { return r.json(); }).then(function (d) { D = d; boot(); })
      .catch(function () { document.getElementById("panel").innerHTML = '<p class="empty">Could not load dataset_v2.js or dataset_v2.json.</p>'; });
  } else { boot(); }

})();
</script>
</body>
